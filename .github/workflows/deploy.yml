name: Deploy IAM Roles

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-2

jobs:
  deploy:
    name: Deploy to AWS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy infrastructure
        uses: stackgobrr/common-github-actions/actions/terraform-deploy@main
        with:
          terraform-version: "1.14.1"
          working-directory: "infra"
          terraform-wrapper: false
          auto-approve: true
          format-check: true
        env:
          AWS_REGION: ${{ env.AWS_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          TF_VAR_aws_account_id: "575108940418"
          TF_VAR_aws_region: ${{ env.AWS_REGION }}
          TF_VAR_github_org: "stackgobrr"

      - name: Output role ARNs
        run: |
          cd infra
          echo "Deployed IAM Role ARNs:"
          echo ""
          terraform output -json | jq -r 'to_entries[] | "  \(.key): \(.value.value)"'
          echo ""

      - name: Generate GitHub App token
        id: generate-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: stackgobrr

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Update repository variables
        run: uv run python scripts/update_repo_variables.py
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          AWS_REGION: ${{ env.AWS_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Deployment complete
        run: echo "::notice title=Deployment Complete::IAM roles deployed and variables updated successfully"
